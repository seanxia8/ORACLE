[project]
name = "oracle"
version = "0.1.0"
description = "Consequence-aware failure diagnostics for particle reconstruction"
requires-python = ">=3.10,<3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "src/noise_module",
    "src/oracle_paired",
    "src/qp_simulator",
    "src/reconstruction_model",
    "src/tidmad_transformer",
]

# CUDA training torch (Linux GPU nodes). This wheel has no macOS build, so
# `uv sync` cannot resolve reconstruction_model or tidmad on a Mac. For CPU/macOS
# development use the separate `.venv-cpu` recipe in README.md ("Running the
# tests") rather than an --override; the previously documented override was not
# valid uv syntax and never worked.
[[tool.uv.index]]
name = "torch_cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
default = false

[tool.uv.sources]
torch = { index = "torch_cuda" }

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ipykernel>=6.31.0",
    "matplotlib>=3.7",
    "nbclient>=0.10",
    "nbconvert>=7.0",
]

[tool.pytest.ini_options]
markers = [
    "statistical: confidence-aware ensemble statistical tests",
    "integration: composed pipeline tests",
    "calibration: empirical calibration and held-out validation tests",
    "slow: larger validation or performance tests",
]
