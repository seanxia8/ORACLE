[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-simulation"
version = "0.1.0"
description = "Cross-geometry event generation: one Prometheus injection replayed through every NuBench geometry, with the recentring the naive replay omits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dowling Wong", email = "wangdowling@gmail.com" }]
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "h5py>=3.10"]

[project.optional-dependencies]
readout = ["pandas>=2.0", "pyarrow>=14", "awkward>=2.0"]
analysis = ["matplotlib>=3.7", "tabulate>=0.9"]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["prometheus_simulation"]

[tool.setuptools.package-dir]
prometheus_simulation = "."

[tool.setuptools.package-data]
prometheus_simulation = ["config/*.yaml"]
